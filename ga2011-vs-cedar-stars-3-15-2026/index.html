.layout { display: grid; grid-template-columns: 240px 1fr; height: calc(100vh - 95px); }

/* ── Player list ── */

.team2 .dist-fill, .team3 .dist-fill { background: var(--team3); }

.empty-state { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--muted); font-size: 1rem; }

function teamGroup(tid) { return tid <= 1 ? 1 : 3; }

let activeTeam = 1;

// ─── Team tab switching ───────────────────────────────────────
document.querySelectorAll('.team-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.team-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeTeam = parseInt(btn.dataset.team);
    activePlayer = null;
    renderList();
    renderOverview(activeTeam);
  });
});

// ─── Player list ─────────────────────────────────────────────
function maxDist() {
  return Math.max(...DATA.players.filter(p => teamGroup(p.team_id) === activeTeam && p.jersey >= 0 && p.minutes_played >= 1).map(p => p.distance_m), 1);
}

function unknownPlayers() {
  return DATA.players.filter(p =>
    teamGroup(p.team_id) === activeTeam &&
    p.jersey === -1 &&
    (p.minutes_played >= 1 || p.shots > 0 || p.goals > 0)
  );
}

function aggregateUnknowns() {
  const us = unknownPlayers();
  if (!us.length) return null;
  const sum = k => us.reduce((s, p) => s + (p[k] || 0), 0);
  const mx  = k => Math.max(...us.map(p => p[k] || 0));
  const cat = k => us.flatMap(p => p[k] || []);
  const heatmap = us[0].heatmap
    ? us[0].heatmap.map((row, r) => row.map((_, c) =>
        us.reduce((s, p) => s + (p.heatmap ? p.heatmap[r][c] : 0), 0)))
    : null;
  return {
    jersey: -1, team_id: us[0].team_id, name: null,
    _unknown_count: us.length,
    distance_m: sum('distance_m'), minutes_played: Math.round(sum('minutes_played')),
    top_speed_kmh: mx('top_speed_kmh'), top_speed_smoothed_kmh: mx('top_speed_smoothed_kmh'),
    avg_speed_kmh: sum('avg_speed_kmh') / us.length,
    possession_time_s: sum('possession_time_s'),
    shots: sum('shots'), goals: sum('goals'), assists: sum('assists'), xg: sum('xg'),
    shots_on_target: sum('shots_on_target'), blocked_shots: sum('blocked_shots'),
    shot_timestamps: cat('shot_timestamps').sort((a,b)=>a-b),
    shot_xg_values: cat('shot_xg_values'),
    goal_timestamps: cat('goal_timestamps').sort((a,b)=>a-b),
    shot_on_target_timestamps: cat('shot_on_target_timestamps').sort((a,b)=>a-b),
    passes: sum('passes'), accurate_passes: sum('accurate_passes'),
    passes_own_half: sum('passes_own_half'), accurate_passes_own_half: sum('accurate_passes_own_half'),
    passes_opp_half: sum('passes_opp_half'), accurate_passes_opp_half: sum('accurate_passes_opp_half'),
    long_passes: sum('long_passes'), accurate_long_passes: sum('accurate_long_passes'),
    crosses: sum('crosses'), accurate_crosses: sum('accurate_crosses'),
    cross_timestamps: cat('cross_timestamps').sort((a,b)=>a-b),
    accurate_cross_timestamps: cat('accurate_cross_timestamps').sort((a,b)=>a-b),
    big_chances_created: sum('big_chances_created'),
    touches: sum('touches'), unsuccessful_touches: sum('unsuccessful_touches'),
    dribbles: sum('dribbles'), successful_dribbles: sum('successful_dribbles'),
    was_fouled: sum('was_fouled'), fouls_committed: sum('fouls_committed'),
    possessions_lost: sum('possessions_lost'),
    tackles: sum('tackles'), tackles_won: sum('tackles_won'),
    interceptions: sum('interceptions'), clearances: sum('clearances'),
    duels: sum('duels'), duels_won: sum('duels_won'),
    carry_dist_m: sum('carry_dist_m'), carry_count: sum('carry_count'), carry_prog_m: sum('carry_prog_m'),
    sprint_count: sum('sprint_count'),
    walk_dist_m: sum('walk_dist_m'), jog_dist_m: sum('jog_dist_m'), run_dist_m: sum('run_dist_m'),
    high_speed_dist_m: sum('high_speed_dist_m'), sprint_dist_m: sum('sprint_dist_m'),
    tracks: cat('tracks'), heatmap,
  };
}

function renderList() {
  const query = document.getElementById('searchBox').value.toLowerCase();
  const players = DATA.players
    .filter(p => teamGroup(p.team_id) === activeTeam && p.jersey >= 0 && p.minutes_played >= 1)
    .filter(p => query === '' || String(p.jersey).includes(query) || (p.name || '').toLowerCase().includes(query));

      <div class="jersey-badge">${p.jersey}</div>
      <div class="player-item-info">

        <div class="player-item-dist">${(p.distance_m/1000).toFixed(1)} km · ${p.minutes_played}'</div>

      </div>
      ${badges ? `<div style="font-size:.8rem;flex-shrink:0;margin-left:4px">${badges}</div>` : ''}`;

                   (totalGoals > 0 ? '⚽' + (totalGoals >= 2 ? totalGoals : '') : '');
    const div = document.createElement('div');
    div.className = 'player-item team' + unk[0].team_id + (activePlayer === -1 ? ' active' : '');
    div.dataset.jersey = '-1';
    div.innerHTML = `
      <div class="jersey-badge" style="opacity:0.45;font-size:.75rem">?</div>
      <div class="player-item-info">
        <div class="player-item-name" style="color:var(--muted)">Unknown (${unk.length})</div>

      </div>
      ${badges ? `<div style="font-size:.8rem;flex-shrink:0;margin-left:4px">${badges}</div>` : ''}`;
    div.addEventListener('click', () => selectPlayer(-1));
    wrap.appendChild(div);
  }
}

document.getElementById('searchBox').addEventListener('input', renderList);

// ─── Player selection ─────────────────────────────────────────
function selectPlayer(jersey) {
  activePlayer = jersey;
  if (jersey === -1) {
    const agg = aggregateUnknowns();
    if (!agg) return;
    renderList();
    renderDetail(agg);
    return;
  }
  const p = DATA.players.find(x => teamGroup(x.team_id) === activeTeam && x.jersey === jersey);
  if (!p) return;
  renderList();
  renderDetail(p);
}

// ─── Detail panel ─────────────────────────────────────────────
function renderDetail(p) {
  const teamClass = 'team' + p.team_id;
  const jerseyDisplay = p.jersey >= 0 ? p.jersey : '?';
  const label = p.name ? p.name
    : p.jersey >= 0 ? 'Player #' + p.jersey
    : 'Unknown' + (p._unknown_count ? ' (' + p._unknown_count + ' tracks)' : '');

  const detail = document.getElementById('playerDetail');
  detail.innerHTML = `
    <div class="player-header ${teamClass}">
      <div class="jersey-large" style="${p.jersey < 0 ? 'opacity:0.55' : ''}">${jerseyDisplay}</div>
      <div class="player-header-info">
        <h2>${label}</h2>
        <div class="meta">
          <span class="meta-chip" style="color:var(--muted)">${TEAM_NAMES[p.team_id]}</span>
          <span class="meta-chip">⏱ ${p.minutes_played}'</span>
          <span class="meta-chip">⚡ ${p.top_speed_kmh} km/h</span>
          <span class="meta-chip">📍 ${(p.distance_m/1000).toFixed(2)} km</span>
        </div>
      </div>
    </div>

    <div class="heatmap-wrap">
      <canvas id="heatmapCanvas" width="${CANVAS_W}" height="${CANVAS_H}"></canvas>
    </div>

    <div class="cat-tabs" id="catTabs">
      <button class="cat-tab ${activeCat==='shot'?'active':''}" data-cat="shot">Shot</button>
      <button class="cat-tab ${activeCat==='pass'?'active':''}" data-cat="pass">Pass</button>
      <button class="cat-tab ${activeCat==='dribble'?'active':''}" data-cat="dribble">Dribble</button>
      <button class="cat-tab ${activeCat==='defend'?'active':''}" data-cat="defend">Defend</button>
      <button class="cat-tab ${activeCat==='run'?'active':''}" data-cat="run">Run</button>
    </div>

    <div id="statsPanel"></div>
    <div id="tracksPanel"></div>
  `;


  requestAnimationFrame(() => drawHeatmap(p));

  document.querySelectorAll('.cat-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeCat = btn.dataset.cat;
      renderStats(p);
    });
  });

  renderStats(p);
  renderTracks(p);
}

// ─── Stats panels ─────────────────────────────────────────────
function sv(val, digits, suffix, highlight) {
  if (val === null || val === undefined) return '<span class="stat-value na">—</span>';
  const s = digits >= 0 ? Number(val).toFixed(digits) : String(val);
  const cls = 'stat-value' + (highlight ? ' highlight' : '');
  return `<span class="${cls}">${s}${suffix||''}</span>`;
}

function statsTable(rows) {
  return '<div class="stats-panel">' +
    rows.map(([label, val]) => `<div class="stat-row"><span class="stat-label">${label}</span>${val}</div>`).join('') +
    '</div>';
}

function renderStats(p) {
  const panel = document.getElementById('statsPanel');
  if (!panel) return;

  if (activeCat === 'shot') {
    panel.innerHTML = statsTable([
      ['Goals', sv(p.goals, -1, '', p.goals > 0)],
      ['Expected Goals (xG)', sv(p.xg > 0 ? p.xg : null, 2)],
      ['Total Shots', (() => {
        const base = p.shots > 0 ? p.shots : (p.shots === 0 && p.xg === 0) ? 0 : null;
        if (base === null) return sv(null);
        const goalSet = new Set(p.goal_timestamps || []);
        const times = p.shot_timestamps && p.shot_timestamps.length
          ? `<div style="font-size:.78rem;color:var(--muted);margin-top:2px">${p.shot_timestamps.map((ts, i) => { const xg = (p.shot_xg_values || [])[i] || 0; const isGoal = goalSet.has(ts); const style = isGoal ? 'color:var(--green);font-weight:700' : xg > 0.2 ? 'color:#60a5fa;font-weight:700' : ''; return `<span data-rec-ts="${ts}" style="${style}">${toGameTime(ts, DATA.periods)}</span>`; }).join(', ')}</div>`
          : '';
        return `<div style="text-align:right"><span class="stat-value">${base}</span>${times}</div>`;
      })()],
      ['Shots on Target', (() => {
        if (!p.shots_on_target) return sv(p.shots_on_target, -1);
        const times = p.shot_on_target_timestamps && p.shot_on_target_timestamps.length
          ? `<div style="font-size:.78rem;color:var(--muted);margin-top:2px">${p.shot_on_target_timestamps.map(ts => `<span data-rec-ts="${ts}">${toGameTime(ts, DATA.periods)}</span>`).join(', ')}</div>`
          : '';
        return `<div style="text-align:right"><span class="stat-value">${p.shots_on_target}</span>${times}</div>`;
      })()],

    ]);
  } else if (activeCat === 'pass') {
    const fmtPassRatio = (acc, tot) => tot ? `<span class="stat-value">${acc}/${tot} (${Math.round(100*acc/tot)}%)</span>` : sv(null);
    panel.innerHTML = statsTable([
      ['Assists', sv(p.assists, -1, '', p.assists > 0)],
      ['Big Chance Created', sv(p.big_chances_created, -1)],
      ['Crosses (Accurate)', (() => {
        if (!p.crosses) return sv(null);
        const times = p.cross_timestamps && p.cross_timestamps.length
          ? `<div style="font-size:.78rem;color:var(--muted);margin-top:2px">${p.cross_timestamps.map(ts => {
              const isAcc = p.accurate_cross_timestamps && p.accurate_cross_timestamps.includes(ts);
              return `<span data-rec-ts="${ts}" style="${isAcc ? 'color:var(--green);font-weight:700' : ''}">${toGameTime(ts, DATA.periods)}</span>`;
            }).join(', ')}</div>`
          : '';
        return `<div style="text-align:right"><span class="stat-value">${p.crosses} (${p.accurate_crosses})</span>${times}</div>`;
      })()],
      ['Accurate Passes', fmtPassRatio(p.accurate_passes, p.passes)],
      ['Passes – Opp. Half', fmtPassRatio(p.accurate_passes_opp_half, p.passes_opp_half)],
      ['Passes – Own Half', fmtPassRatio(p.accurate_passes_own_half, p.passes_own_half)],
      ['Long Passes (>10m)', fmtPassRatio(p.accurate_long_passes, p.long_passes)],
    ]);
  } else if (activeCat === 'dribble') {
    panel.innerHTML = statsTable([
      ['Touches', sv(p.touches, -1)],
      ['Unsuccessful Touches', sv(p.unsuccessful_touches, -1)],
      ['Dribbles (Successful)', p.dribbles ? `${p.dribbles} (${p.successful_dribbles})` : sv(null)],
      ['Was Fouled', sv(p.was_fouled, -1)],
      ['Possessions Lost', sv(p.possessions_lost, -1)],
      ['Total Carrying Distance', sv(p.carry_dist_m / 1000, 2, ' km')],
      ['Carries', sv(p.carry_count, -1)],
      ['Total Progression', sv(p.carry_prog_m / 1000, 2, ' km')],
    ]);
  } else if (activeCat === 'defend') {
    panel.innerHTML = statsTable([
      ['Defensive Contributions', sv(null)],
      ['Tackles (Won)', p.tackles ? `${p.tackles} (${p.tackles_won})` : sv(null)],
      ['Interceptions', sv(p.interceptions, -1)],
      ['Clearances', sv(p.clearances, -1)],
      ['Blocked Shots', sv(p.blocked_shots, -1)],
      ['Ground Duels (Won)', p.duels ? `${p.duels} (${p.duels_won})` : sv(null)],
      ['Aerial Duels (Won)', sv(null)],
      ['Fouls', sv(p.fouls_committed, -1)],
      ['Dribbled Past', sv(p.tackles - p.tackles_won, -1)],
    ]);
  } else if (activeCat === 'run') {
    panel.innerHTML = statsTable([
      ['Distance Covered', sv(p.distance_m / 1000, 2, ' km')],
      ['Top Speed', sv(p.top_speed_kmh, 1, ' km/h') + (p.top_speed_smoothed_kmh ? ` <span style="color:var(--muted);font-size:.9em">(${p.top_speed_smoothed_kmh.toFixed(1)} km/h)</span>` : '')],
      ['Sprints', sv(p.sprint_count, -1)],
      ['Walking + Jogging (&lt;14 km/h)', sv((p.walk_dist_m + p.jog_dist_m) / 1000, 2, ' km')],
      ['Running (14–20 km/h)', sv(p.run_dist_m / 1000, 2, ' km')],
      ['High-Speed Running (20–25 km/h)', sv(p.high_speed_dist_m / 1000, 2, ' km')],
      ['Sprinting (&gt;25 km/h)', sv(p.sprint_dist_m / 1000, 2, ' km')],
    ]) + renderZoneChart(p);
  }
}

function renderZoneChart(p) {
  const total = p.distance_m || 1;
  const zones = [
    { label: 'Walk', color: '#4dabf7', dist: p.walk_dist_m },
    { label: 'Jog', color: '#74c0fc', dist: p.jog_dist_m },
    { label: 'Run', color: '#69db7c', dist: p.run_dist_m },
    { label: 'High-Speed', color: '#ffa94d', dist: p.high_speed_dist_m },
    { label: 'Sprint', color: '#ff6b6b', dist: p.sprint_dist_m },
  ];
  const maxZone = Math.max(...zones.map(z => z.dist), 1);
  return '<div class="zone-chart"><h4>Speed Zone Breakdown</h4>' +
    zones.map(z => {
      const pct = Math.round(z.dist / maxZone * 100);
      const km = (z.dist / 1000).toFixed(2);
      const share = Math.round(z.dist / total * 100);
      return `<div class="zone-row">
        <span class="zone-label">${z.label} (${share}%)</span>
        <div class="zone-bar-wrap"><div class="zone-bar" style="width:${pct}%;background:${z.color}"></div></div>
        <span class="zone-val">${km} km</span>
      </div>`;
    }).join('') + '</div>';
}

// ─── Heatmap rendering ────────────────────────────────────────
function drawHeatmap(p) {
  const canvas = document.getElementById('heatmapCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  drawPitch(ctx, W, H);

  if (!p.heatmap) return;
  const grid = p.heatmap;  // GRID_ROWS × GRID_COLS 2-D array (values in seconds)
  const HEATMAP_CAP_S = 30;  // cells at or above this many seconds get full colour

  const cellW = W / GRID_COLS, cellH = H / GRID_ROWS;
  for (let r = 0; r < GRID_ROWS; r++) {
    for (let c = 0; c < GRID_COLS; c++) {
      const v = Math.min(grid[r][c] / HEATMAP_CAP_S, 1.0);
      if (v < 0.04) continue;
      const hue = (1 - v) * 220;   // 220=blue → 0=red
      const alpha = 0.25 + v * 0.65;
      ctx.fillStyle = `hsla(${hue},100%,55%,${alpha.toFixed(2)})`;
      ctx.fillRect(c * cellW, r * cellH, cellW + 0.5, cellH + 0.5);
    }
  }

  // Attack direction arrow — drawn inside the pitch near the bottom touchline
  {
    const isOpp = p.team_id >= 2;
    const aY = H * 0.88;
    const aX1 = isOpp ? W * 0.05 : W * 0.95;
    const aX2 = isOpp ? W * 0.40 : W * 0.60;
    const aHead = 9;
    ctx.save();
    ctx.globalAlpha = 0.80;
    ctx.strokeStyle = '#fff';
    ctx.fillStyle = '#fff';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(aX1, aY); ctx.lineTo(aX2, aY); ctx.stroke();
    ctx.beginPath();
    if (isOpp) {
      ctx.moveTo(aX2, aY);
      ctx.lineTo(aX2 - aHead, aY - aHead);
      ctx.lineTo(aX2 - aHead, aY + aHead);
    } else {
      ctx.moveTo(aX2, aY);
      ctx.lineTo(aX2 + aHead, aY - aHead);
      ctx.lineTo(aX2 + aHead, aY + aHead);
    }
    ctx.closePath(); ctx.fill();
    ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = isOpp ? 'left' : 'right';
    ctx.fillText('ATTACK', aX1, aY - 6);
    ctx.restore();
  }
}

function drawPitch(ctx, W, H) {
  ctx.fillStyle = '#1e4d2b';
  ctx.fillRect(0, 0, W, H);

  const stripeW = W / 5;
  ctx.fillStyle = 'rgba(255,255,255,0.03)';
  for (let i = 0; i < 5; i += 2) ctx.fillRect(i * stripeW, 0, stripeW, H);

  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.lineWidth = 1;
  ctx.strokeRect(0.5, 0.5, W - 1, H - 1);
  ctx.beginPath(); ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H); ctx.stroke();

  const r_c = 9.15 / PITCH_LEN * W;
  ctx.beginPath(); ctx.arc(W / 2, H / 2, r_c, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath(); ctx.arc(W / 2, H / 2, 2, 0, Math.PI * 2); ctx.fill();

  const pa_d = Math.min(16.5, PITCH_LEN * 0.22) / PITCH_LEN * W;
  const pa_hw = Math.min(20.16, PITCH_WID / 2) / PITCH_WID * H;
  const pa_y = H / 2 - pa_hw;
  ctx.strokeRect(0.5, pa_y, pa_d, pa_hw * 2);
  ctx.strokeRect(W - pa_d - 0.5, pa_y, pa_d, pa_hw * 2);

  const ga_d = Math.min(5.5, PITCH_LEN * 0.08) / PITCH_LEN * W;
  const ga_hw = Math.min(9.16, PITCH_WID / 2) / PITCH_WID * H * 0.7;
  const ga_y = H / 2 - ga_hw;
  ctx.strokeRect(0.5, ga_y, ga_d, ga_hw * 2);
  ctx.strokeRect(W - ga_d - 0.5, ga_y, ga_d, ga_hw * 2);

  const ps_x = 11.0 / PITCH_LEN * W;
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath(); ctx.arc(ps_x, H / 2, 2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(W - ps_x, H / 2, 2, 0, Math.PI * 2); ctx.fill();

  const goal_hw = 3.66 / PITCH_WID * H;
  const goal_d = W * 0.012;
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.fillRect(0, H / 2 - goal_hw, -goal_d, goal_hw * 2);
  ctx.fillRect(W, H / 2 - goal_hw, goal_d, goal_hw * 2);
  ctx.strokeStyle = 'rgba(255,255,255,0.7)';
  ctx.strokeRect(0, H / 2 - goal_hw, -goal_d + 0.5, goal_hw * 2);
  ctx.strokeRect(W - 0.5, H / 2 - goal_hw, goal_d, goal_hw * 2);
}

// ─── Tracks panel ────────────────────────────────────────────
function fmtTime(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return m + ':' + String(sec).padStart(2, '0');
}

function renderTracks(p) {
  const panel = document.getElementById('tracksPanel');
  if (!panel) return;
  const tracks = p.tracks || [];
  if (tracks.length === 0) { panel.innerHTML = ''; return; }
  const periods = DATA.periods;
  const rows = tracks.map(t => {
    const dur = t.last_seen_s - t.first_seen_s;
    const m = Math.floor(dur / 60), s = Math.floor(dur % 60);
    const durStr = m > 0 ? m + 'm ' + String(s).padStart(2,'0') + 's' : s + 's';
    const momentChips = (t.moments || []).map(ts =>
      `<span class="moment-chip" data-rec-ts="${ts}" onclick="showMomentModal(${ts}, ${t.track_id}, ${p.jersey})">${toGameTime(ts, periods)}</span>`
    ).join('');
    return `<tr>
      <td class="track-id">${t.track_id}</td>
      <td><span data-rec-ts="${t.first_seen_s}">${toGameTime(t.first_seen_s, periods)}</span></td>
      <td><span data-rec-ts="${t.last_seen_s}">${toGameTime(t.last_seen_s, periods)}</span></td>
      <td>${durStr}</td>
      <td>${momentChips || '<span style="color:var(--muted)">—</span>'}</td>
    </tr>`;
  }).join('');
  panel.innerHTML = `<div class="tracks-section">
    <h4>Veo Tracks <span style="font-weight:400;font-size:.75rem;color:var(--muted)">(for debugging only)</span></h4>
    <table class="tracks-table">
      <thead><tr><th>Track ID</th><th>Start</th><th>End</th><th>Duration</th><th>Key Moments</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

// ─── Moment snapshot modal ───────────────────────────────────
function showMomentModal(ts, trackId, jersey) {
  const snap = DATA.snapshots ? DATA.snapshots[String(ts)] : null;
  const p = DATA.players.find(x => x.jersey === jersey && teamGroup(x.team_id) === activeTeam);
  const label = p ? (p.name || '#' + jersey) : '#' + jersey;
  const title = label + ' · ' + toGameTime(ts, DATA.periods);

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });

  const card = document.createElement('div');
  card.className = 'modal-card';

  // Header
  const hdr = document.createElement('div');
  hdr.className = 'modal-header';
  hdr.innerHTML = `<span>${title}</span><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button>`;
  card.appendChild(hdr);

  // Frame section: video frame with pitch minimap overlaid top-right
  const frameWrap = document.createElement('div');
  frameWrap.className = 'modal-frame-wrap';

  const img = document.createElement('img');
  img.src = 'track_moments/' + ts.toFixed(1) + '.jpg';
  img.style.cssText = 'width:100%;display:block';
  frameWrap.appendChild(img);

  // Small pitch overlay (shown when video frame is present)
  const ovSmall = document.createElement('canvas');
  ovSmall.width = 200; ovSmall.height = Math.round(200 * PITCH_LEN / PITCH_WID);
  ovSmall.className = 'pitch-overlay';
  frameWrap.appendChild(ovSmall);

  // Full-size pitch (shown when video frame is missing)
  const ovFull = document.createElement('canvas');
  ovFull.width = 560; ovFull.height = Math.round(560 * PITCH_LEN / PITCH_WID);
  ovFull.style.cssText = 'width:100%;display:none;';
  frameWrap.appendChild(ovFull);

  card.appendChild(frameWrap);
  overlay.appendChild(card);
  document.body.appendChild(overlay);

  if (snap) {
    drawPitchOverlay(ovSmall, snap, trackId);
    drawPitchOverlay(ovFull, snap, trackId);
  } else {
    ovSmall.style.display = 'none';
  }

  img.addEventListener('error', () => {
    img.style.display = 'none';
    ovSmall.style.display = 'none';
    ovFull.style.display = 'block';
    if (!snap) {
      const msg = document.createElement('div');
      msg.className = 'modal-no-frame';
      msg.textContent = 'No frame available — re-run veo-fetch to extract frames.';
      frameWrap.appendChild(msg);
    }
  });
}

function drawPitchOverlay(canvas, snap, trackId) {
  const ctx = canvas.getContext('2d');
  const CW = canvas.width, CH = canvas.height;
  drawPitchVertical(ctx, CW, CH);

  const dotR = Math.max(3.5, CW / 28);
  const target = snap.find(e => e.track_id === trackId && !e.is_ball);

  for (const e of snap) {
    if (e.is_ball || e.track_id === trackId) continue;
    const cx = e.y * CW, cy = (1 - e.x) * CH;
    const tc = TEAM_COLORS[e.team_id] || { stroke: '#888', fill: 'rgba(136,136,136,0.25)' };
    ctx.beginPath(); ctx.arc(cx, cy, dotR, 0, Math.PI * 2);
    ctx.fillStyle = tc.fill; ctx.fill();
    ctx.strokeStyle = tc.stroke; ctx.lineWidth = 1; ctx.stroke();
  }
  const ball = snap.find(e => e.is_ball);
  if (ball) {
    ctx.beginPath(); ctx.arc(ball.y * CW, (1 - ball.x) * CH, dotR * 0.9, 0, Math.PI * 2);
    ctx.fillStyle = 'white'; ctx.fill();
    ctx.strokeStyle = 'rgba(180,180,180,0.8)'; ctx.lineWidth = 1; ctx.stroke();
  }
  if (target) {
    const tx = target.y * CW, ty = (1 - target.x) * CH;
    const tc = TEAM_COLORS[target.team_id] || { stroke: '#fff', fill: 'rgba(255,255,255,0.3)' };
    const r = dotR * 1.8;
    ctx.beginPath(); ctx.arc(tx, ty, r, 0, Math.PI * 2);
    ctx.fillStyle = tc.fill; ctx.fill();
    ctx.strokeStyle = tc.stroke; ctx.lineWidth = 2; ctx.stroke();
    if (CW >= 120) {
      ctx.fillStyle = tc.stroke; ctx.font = 'bold ' + Math.round(r * 0.9) + 'px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(target.jersey >= 0 ? target.jersey : '?'), tx, ty);
    }
  }
}

// ─── Team overview ────────────────────────────────────────────
function toGameMin(ts, periods) {
  if (!periods || !periods.length) return Math.round(ts / 60);
  const h1 = periods[0], h2 = periods.length > 1 ? periods[1] : null;
  const h1Mins = (h1[1] - h1[0]) / 60;
  const mins = h2 && ts >= h2[0] ? h1Mins + (ts - h2[0]) / 60 : (ts - h1[0]) / 60;
  return Math.max(0, Math.round(mins));
}

function toGameTime(ts, periods) {
  if (!periods || !periods.length) return fmtTime(ts);
  const h1 = periods[0], h2 = periods.length > 1 ? periods[1] : null;
  const h1Secs = h1[1] - h1[0];
  const secs = (h2 && ts >= h2[0]) ? h1Secs + (ts - h2[0]) : (ts - h1[0]);
  if (secs < 0) return '0:00';
  const m = Math.floor(secs / 60), s = Math.floor(secs % 60);
  return m + ':' + String(s).padStart(2, '0');
}

function inferSubTimes(p, periods, isStarter) {
  if (!periods || !periods.length) return {};
  const h1Start = periods[0][0];
  const h2 = periods.length > 1 ? periods[1] : null;
  const gameEnd = h2 ? h2[1] : periods[0][1];
  // Sub-in: player not in starting lineup and first appears more than 3 min into play
  const subIn = !isStarter && p.first_seen_s > h1Start + 180
    ? toGameMin(p.first_seen_s, periods) : null;
  const subInTs = subIn != null ? p.first_seen_s : null;
  // Sub-out: starter whose tracking ends more than 2 min before final whistle
  const subOut = isStarter && p.last_seen_s < gameEnd - 120
    ? toGameMin(p.last_seen_s, periods) : null;
  const subOutTs = subOut != null ? p.last_seen_s : null;
  return { subIn, subInTs, subOut, subOutTs };
}

function benchCardHTML(p, sub, teamId) {
  const subChip = sub && sub.subIn != null
    ? `<span class="sub-chip sub-in" data-rec-ts="${sub.subInTs}">↑${sub.subIn}'</span>` : '';
  return `<div class="bench-card team${teamId}" onclick="selectPlayer(${p.jersey})">
    <div class="bench-badge">${p.jersey}</div>
    <div class="bench-info">
      <div class="bench-name">${p.name || '#' + p.jersey}</div>
      <div class="bench-meta">${(p.distance_m / 1000).toFixed(1)} km · ${p.minutes_played}'</div>
    </div>
    ${subChip}
  </div>`;
}

function renderOverview(teamId) {
  const detail = document.getElementById('playerDetail');

  // Outfield players only (exclude GK: team_id 0 for ours, 2 for opponent)
  const outfieldTid = teamId === 1 ? 1 : 3;
  const allTeamPlayers = DATA.players.filter(p => teamGroup(p.team_id) === teamId && p.jersey >= 0 && p.minutes_played >= 1);
  const outfield = allTeamPlayers.filter(p => p.team_id === outfieldTid);

  const sum = (fn) => outfield.reduce((a, p) => a + (fn(p) || 0), 0);
  const totalGoals    = sum(p => p.goals);
  const totalXg       = sum(p => p.xg);
  const totalShots    = sum(p => p.shots);
  const totalOnTarget = sum(p => p.shots_on_target);
  const totalPasses   = sum(p => p.passes);
  const totalAccPasses = sum(p => p.accurate_passes);
  const totalDist     = sum(p => p.distance_m);
  const totalSprints  = sum(p => p.sprint_count);

  const passRatio = totalPasses
    ? `${totalAccPasses}/${totalPasses} (${Math.round(100 * totalAccPasses / totalPasses)}%)`
    : '—';

  const teamStatsHTML = `
    <div class="team-stats-section">
      <div class="bench-header">Team Statistics</div>
      ${statsTable([
        ['Goals', `<span class="stat-value">${totalGoals}</span>`],
        ['Expected Goals (xG)', `<span class="stat-value">${totalXg.toFixed(2)}</span>`],
        ['Total Shots', `<span class="stat-value">${totalShots}</span>`],
        ['Shots on Target', `<span class="stat-value">${totalOnTarget}</span>`],
        ['Accurate Passes', `<span class="stat-value">${passRatio}</span>`],
        ['Distance Covered', `<span class="stat-value">${(totalDist / 1000).toFixed(1)} km</span>`],
        ['Sprints', `<span class="stat-value">${totalSprints}</span>`],
      ])}
    </div>`;

  if (teamId !== 1 || !LINEUP) {
    detail.innerHTML = `<div class="overview-wrap">${teamStatsHTML}</div>`;
    return;
  }

  const starterSet = new Set(LINEUP.rows.flatMap(r => r.jerseys));
  const bench = allTeamPlayers.filter(p => !starterSet.has(p.jersey));
  const periods = DATA.periods;

  const subMap = {};
  allTeamPlayers.forEach(p => {
    subMap[p.jersey] = inferSubTimes(p, periods, starterSet.has(p.jersey));
  });

  const benchCards = bench.map(p => benchCardHTML(p, subMap[p.jersey], teamId)).join('');
  const benchHTML = bench.length > 0
    ? `<div class="bench-section">
        <div class="bench-header">Bench / Substitutes</div>
        <div class="bench-grid">${benchCards}</div>
       </div>`
    : '';

  detail.innerHTML = `
    <div class="overview-wrap">
      <div class="overview-header">
        <span class="overview-formation">${LINEUP.formation}</span>
        <span class="overview-team-name">${TEAM_NAMES[teamId]}</span>
      </div>
      <div class="overview-pitch-wrap">
        <canvas id="overviewCanvas" width="280" height="460"></canvas>
      </div>
      ${benchHTML}
      ${teamStatsHTML}
    </div>`;

  drawOverviewPitch(allTeamPlayers, subMap, teamId);
}

function drawOverviewPitch(teamPlayers, subMap, teamId) {
  const canvas = document.getElementById('overviewCanvas');
  if (!canvas || !LINEUP) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  drawPitchVertical(ctx, W, H);

  const tc = TEAM_COLORS[teamId];
  const hitTargets = [];

  for (const row of LINEUP.rows) {
    const n = row.jerseys.length;
    row.jerseys.forEach((jersey, i) => {
      const p = teamPlayers.find(x => x.jersey === jersey) || null;
      const [cx, cy] = formationPos(row.label, i, n, W, H);
      const sub = subMap[jersey] || {};
      drawFormationPlayer(ctx, cx, cy, jersey, p, sub.subOut != null ? sub.subOut : null, tc, row.label === 'GK');
      hitTargets.push([cx, cy, jersey]);
    });
  }

  canvas.onclick = e => {
    const rect = canvas.getBoundingClientRect();
    const mx = (e.clientX - rect.left) * (W / rect.width);
    const my = (e.clientY - rect.top) * (H / rect.height);
    for (const [cx, cy, jersey] of hitTargets) {
      if (Math.hypot(mx - cx, my - cy) < 22) { selectPlayer(jersey); return; }
    }
  };
}

// Map a formation row label + player index to canvas (x, y) pixels.
// Pitch x-axis (length) maps to canvas y-axis: GK at bottom (high y), ATT at top (low y).
// Pitch y-axis (width) maps to canvas x-axis.
function formationPos(label, i, n, W, H) {
  const rowDepth = { GK: 0.06, DEF: 0.24, MID: 0.52, ATT: 0.76, FW: 0.76, FWD: 0.76, MF: 0.52 };
  const pitchX = rowDepth[label] ?? 0.5;
  const pad = 0.12;
  const pitchY = n <= 1 ? 0.5 : pad + i * (1 - 2 * pad) / (n - 1);
  return [pitchY * W, (1 - pitchX) * H];
}

function drawFormationPlayer(ctx, cx, cy, jersey, p, subOutMin, tc, isGK=false) {
  const R = 18;

  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.fillStyle = p ? tc.fill : 'rgba(80,80,80,0.2)';
  ctx.fill();
  ctx.strokeStyle = p ? tc.stroke : '#555';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.fillStyle = p ? tc.stroke : '#888';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  if (isGK && p && p.name) {
    const lastName = p.name.split(' ').slice(-1)[0];
    ctx.font = 'bold 8px -apple-system,sans-serif';
    ctx.fillText(lastName, cx, cy);
  } else {
    ctx.font = 'bold 12px -apple-system,sans-serif';
    ctx.fillText(String(jersey), cx, cy);
  }

  let gy = cy + R + 4;
  if (!isGK && p && p.name) {
    ctx.fillStyle = 'rgba(230,237,243,0.85)';
    ctx.font = '9px -apple-system,sans-serif';
    ctx.textBaseline = 'top';
    ctx.fillText(p.name.split(' ')[0], cx, gy);
    gy += 12;
  }
  if (subOutMin != null) {
    ctx.fillStyle = '#ef4444';
    ctx.font = 'bold 9px -apple-system,sans-serif';
    ctx.textBaseline = 'top';
    ctx.fillText('↓' + subOutMin + "'", cx, gy);
  }
}

// Vertical pitch: pitch length → canvas height (GK at bottom), pitch width → canvas width.
function drawPitchVertical(ctx, W, H) {
  ctx.fillStyle = '#1e4d2b';
  ctx.fillRect(0, 0, W, H);

  const stripeH = H / 5;
  ctx.fillStyle = 'rgba(255,255,255,0.03)';
  for (let i = 0; i < 5; i += 2) ctx.fillRect(0, i * stripeH, W, stripeH);

  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.lineWidth = 1;
  ctx.strokeRect(0.5, 0.5, W - 1, H - 1);

  // Centre line (horizontal)
  ctx.beginPath(); ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); ctx.stroke();

  // Centre circle
  const r_c = 9.15 / PITCH_LEN * H;
  ctx.beginPath(); ctx.arc(W / 2, H / 2, r_c, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath(); ctx.arc(W / 2, H / 2, 2, 0, Math.PI * 2); ctx.fill();

  // Penalty areas (top = attacking end, bottom = defending end)
  const pa_d = Math.min(16.5, PITCH_LEN * 0.22) / PITCH_LEN * H;
  const pa_hw = Math.min(20.16, PITCH_WID / 2) / PITCH_WID * W;
  ctx.strokeRect(W / 2 - pa_hw, 0.5, pa_hw * 2, pa_d);           // top (attacking)
  ctx.strokeRect(W / 2 - pa_hw, H - pa_d - 0.5, pa_hw * 2, pa_d); // bottom (defending)

  // Goal areas
  const ga_d = Math.min(5.5, PITCH_LEN * 0.08) / PITCH_LEN * H;
  const ga_hw = Math.min(9.16, PITCH_WID / 2) / PITCH_WID * W * 0.7;
  ctx.strokeRect(W / 2 - ga_hw, 0.5, ga_hw * 2, ga_d);
  ctx.strokeRect(W / 2 - ga_hw, H - ga_d - 0.5, ga_hw * 2, ga_d);

  // Penalty spots
  const ps_y = 11.0 / PITCH_LEN * H;
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath(); ctx.arc(W / 2, ps_y, 2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(W / 2, H - ps_y, 2, 0, Math.PI * 2); ctx.fill();

  // Goals (outside canvas top and bottom)
  const goal_hw = 3.66 / PITCH_WID * W;
  const goal_d = H * 0.012;
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.fillRect(W / 2 - goal_hw, 0, goal_hw * 2, -goal_d);
  ctx.fillRect(W / 2 - goal_hw, H, goal_hw * 2, goal_d);
  ctx.strokeStyle = 'rgba(255,255,255,0.7)';
  ctx.strokeRect(W / 2 - goal_hw, -goal_d + 0.5, goal_hw * 2, goal_d);
  ctx.strokeRect(W / 2 - goal_hw, H - 0.5, goal_hw * 2, goal_d);
}

// ─── Init ─────────────────────────────────────────────────────
renderList();
renderOverview(activeTeam);

// ─── Recording-time tooltip ────────────────────────────────────
const _ttEl = document.createElement('div');
_ttEl.id = 'ts-tooltip';
document.body.appendChild(_ttEl);

document.addEventListener('mouseover', e => {
  const el = e.target.closest('[data-rec-ts]');
  if (!el) { _ttEl.style.display = 'none'; return; }
  _ttEl.textContent = 'rec ' + fmtTime(parseFloat(el.dataset.recTs));
  _ttEl.style.display = 'block';
});
document.addEventListener('mousemove', e => {
  if (_ttEl.style.display === 'none') return;
  _ttEl.style.left = (e.clientX + 12) + 'px';
  _ttEl.style.top  = (e.clientY + 16) + 'px';
});
document.addEventListener('mouseout', e => {
  if (!e.target.closest('[data-rec-ts]')) _ttEl.style.display = 'none';
});
</script>
